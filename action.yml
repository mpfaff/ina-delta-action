name: ina delta
description: Generate an ina delta between the artifacts of two workflow runs (GitHub or Forgejo).

inputs:
  artifact-pattern:
    description: Regular expression matching the full artifact name, in both runs.
    required: true
  new-run-id:
    description: ID of the run that produced the new artifact.
    required: true
  previous-run-id:
    description: >
      ID of the run that produced the base artifact. Default: the newest earlier
      successful run of the same workflow and ref.
    required: false
    default: ""
  ina-url:
    description: Release download URL holding ina-<arch> binaries and SHA256SUMS.
    required: false
    default: https://github.com/mpfaff/ina-delta-action/releases/download/ina-6e49ed92c00e
  token:
    description: Token allowed to read Actions runs and artifacts.
    required: false
    default: ${{ github.token }}

outputs:
  delta-path:
    description: Path of the generated delta. Empty if there was no previous artifact.
    value: ${{ steps.compute-delta.outputs.delta-path }}
  delta-name:
    description: File name of the generated delta.
    value: ${{ steps.compute-delta.outputs.delta-name }}

runs:
  using: composite
  steps:
    - name: Download artifacts
      id: download-artifacts
      env:
        API_URL: ${{ github.api_url }}
        REPOSITORY: ${{ github.repository }}
        TOKEN: ${{ inputs.token }}
        ARTIFACT_PATTERN: ${{ inputs.artifact-pattern }}
        NEW_RUN_ID: ${{ inputs.new-run-id }}
        PREVIOUS_RUN_ID: ${{ inputs.previous-run-id }}
        INA_URL: ${{ inputs.ina-url }}
      run: python3 "${{ github.action_path }}/ina_delta.py"

    - name: Compute delta
      id: compute-delta
      env:
        NEW_FILE: ${{ steps.download-artifacts.new-file }}
        OLD_FILE: ${{ steps.download-artifacts.old-file }}
        WORK: ${{ steps.download-artifacts.work }}
      run: |
        set -euox

        mkdir -p "ina-delta"
        deltaF=$(realpath "ina-delta/$(basename "$NEW_FILE").ina")

        $WORK/ina diff "$OLD_FILE" "$NEW_FILE" "$deltaF"
        echo "Computed delta"
        du -h "$deltaF"

        echo "delta-path=$deltaF" >> "$GITHUB_OUTPUT"
        echo "delta-name=$(basename "$deltaF")" >> "$GITHUB_OUTPUT"

    - name: Clean up
      env:
        WORK: ${{ steps.download-artifacts.work }}
      run: |
        # clean up the large artifacts
        rm -rf "$WORK"
